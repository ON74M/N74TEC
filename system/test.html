    <style>

        @font-face {
            font-family: "Neuropol";
            src: url("https://fonts.cdnfonts.com/s/15001/Neuropol-Regular.woff")

            font-weight: normal;
            font-style: normal;
        }

        :root {
            --matrix-green: #00ff41;
            --matrix-dark: #020b05;
            --matrix-black: #000000;
            --matrix-soft: #07150c;
            --text: #d7ffe2;
            --text-soft: #7ca889;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Ubuntu", sans-serif;
            background:

                    circle at center,
                    #07150c 0%,
                    #020b05 45%,
                    #000000 100%

            color: var(--text);
            overflow: hidden;
        }

        /* ======================================================
           MATRIX BACKGROUND
           ====================================================== */

            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
        }

        /* ======================================================
           MAIN CONTAINER
           ====================================================== */

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 430px;

            border: 1px solid var(--border);

            padding: 42px 38px;

        }

        /* ======================================================
           LOGO
           ====================================================== */

        .logo {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo h1 {
            font-family: "Neuropol", sans-serif;
            font-size: 38px;
            letter-spacing: 3px;
            color: var(--matrix-green);

            text-shadow:
                0 0 5px rgba(0, 255, 65, 0.8),
                0 0 15px rgba(0, 255, 65, 0.35);
        }

        .logo p {
            margin-top: 10px;

            font-size: 12px;
            letter-spacing: 3px;

            color: var(--text-soft);
            text-transform: uppercase;
        }

        /* ======================================================
           SYSTEM STATUS
           ====================================================== */

        .status {
            margin: 28px 0;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            font-size: 11px;
            letter-spacing: 1.5px;

            color: var(--text-soft);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--matrix-green);

            box-shadow:
                0 0 6px var(--matrix-green),
                0 0 12px rgba(0, 255, 65, 0.6);

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* ======================================================
           FORM
           ====================================================== */

            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            letter-spacing: 1px;

            color: var(--text-soft);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--text-soft);

        }

        .form-group input {

<body>

    <!-- ========================================================

    <canvas id="matrix"></canvas>

    <!-- ========================================================
         JAVASCRIPT
         ======================================================== -->

    <script>

        /*
        ============================================================
        N74 TEC — MATRIX ENGINE
        ============================================================

        Nesta primeira versão o JavaScript possui apenas funções
        visuais e de demonstração.

        NÃO existe autenticação real.

        Quando o backend for criado, este formulário deverá enviar
        os dados para uma API, por exemplo:

            POST /api/auth/login

        O backend será responsável por:

            - validar usuário
            - validar senha
            - criar sessão/token
            - identificar perfil
            - aplicar permissões
            - redirecionar para o dashboard apropriado

        ============================================================
        */


        /* ========================================================
           MATRIX
           ======================================================== */

        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let columns;
        let drops;

        const characters =
            "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@<>[]{}";


        function resizeMatrix() {

            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            const fontSize = 14;

            columns = Math.floor(width / fontSize);

            drops = [];

            for (let i = 0; i < columns; i++) {

                drops[i] =
                    Math.floor(
                        Math.random() * height / fontSize
                    );

            }

        }


        function drawMatrix() {

            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

            ctx.font = "14px monospace";

            for (let i = 0; i < drops.length; i++) {

                const text =
                    characters.charAt(
                        Math.floor(
                            Math.random() * characters.length
                        )
                    );

                ctx.fillStyle = "#00ff41";

                ctx.fillText(
                    text,
                    i * 14,
                    drops[i] * 14
                );

                if (
                    drops[i] * 14 > height &&
                    Math.random() > 0.975
                ) {

                    drops[i] = 0;

                }

                drops[i]++;

            }

        }


        resizeMatrix();

        setInterval(
            drawMatrix,
            50
        );


        window.addEventListener(
            "resize",
            resizeMatrix
        );


        /* ========================================================
           LOGIN — SOMENTE DEMONSTRAÇÃO
           ======================================================== */

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                /*
                ----------------------------------------------------
                ATENÇÃO

                Este trecho não autentica ninguém.

                Ele existe somente para impedir o envio tradicional
                do formulário nesta primeira versão.

                A autenticação real será implementada quando
                conectarmos o frontend ao backend.
                ----------------------------------------------------
                */

                const button =
                    loginForm.querySelector(
                        ".login-button"
                    );

                button.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSANDO...';

                button.disabled = true;


                setTimeout(
                    function () {

                        button.innerHTML =
                            '<i class="fa-solid fa-right-to-bracket"></i> ENTRAR NA PLATAFORMA';

                        button.disabled = false;

                        alert(
                            "Interface inicial da Plataforma N74 TEC.\n\nA autenticação será conectada ao backend nas próximas etapas."
                        );

                    },
                    800
                );

            }
        );

    </script>
